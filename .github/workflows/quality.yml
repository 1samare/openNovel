name: Quality

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Check README contract
        run: npm run check:readmes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Production Electron smoke
        id: electron_smoke
        env:
          ELECTRON_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}\open-novel-electron-smoke
        run: npm run test:electron-smoke
      - name: Upload Electron smoke diagnostics
        if: ${{ failure() && steps.electron_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-diagnostics
          path: ${{ runner.temp }}\open-novel-electron-smoke
          if-no-files-found: warn
          retention-days: 7
